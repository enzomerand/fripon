# Fripon Cloud on the VPS: `docker compose -f server/compose.yml up -d --build` from /opt/fripon-cloud.
# Nothing is published on the host: the shared Caddy joins `friponnet` and proxies to
# fripon-cloud:8787 (see server/caddy/fripon.caddy). Steps and backups: docs/cloud.md.
# Needs Docker Compose 2.30 or later (`env_file` with `format: raw`).
name: fripon-cloud

services:
  fripon-cloud:
    build:
      # The repository root: the server bundles modules from lib/.
      context: ..
      dockerfile: server/Dockerfile
    image: fripon-cloud:latest
    container_name: fripon-cloud
    # server/.env, next to this file, never committed (template: server/.env.example). `raw`: the
    # values are taken as they are, so a `$` in a password is not read as a variable.
    env_file:
      - path: .env
        format: raw
    restart: unless-stopped
    # main.ts closes the server and the database on SIGTERM and waits up to 45 s for the requests in
    # flight (a Vision call and an AI review call may each take 30 s): Docker must wait longer.
    stop_grace_period: 50s
    # Only /data (the volume) and /tmp (SQLite temporary files) are written to.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - data:/data
    networks:
      - friponnet
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

networks:
  # Named, so the Caddy of /opt/reverse-proxy can join it as an external network.
  friponnet:
    name: friponnet

volumes:
  data:
    name: fripon-cloud-data
